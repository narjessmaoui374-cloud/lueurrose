<div class="login-page">
  <div class="container">
    <div class="login-card">
      <h1 class="login-title">
        <i class="bi bi-person-circle"></i> Connexion
      </h1>

      <form (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input 
            type="email" 
            class="form-control" 
            [(ngModel)]="email" 
            name="email"
            placeholder="votre@email.com"
            required>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input 
            type="password" 
            class="form-control" 
            [(ngModel)]="password" 
            name="password"
            placeholder="••••••••"
            required>
        </div>

        <!-- Remember me -->
        <div class="mb-3 form-check">
          <input 
            type="checkbox" 
            class="form-check-input" 
            [(ngModel)]="rememberMe" 
            name="rememberMe"
            id="rememberMe">
          <label class="form-check-label" for="rememberMe">
            Se souvenir de moi
          </label>
        </div>

        <!-- Error message -->
        <div class="alert alert-danger" *ngIf="errorMessage">
          <i class="bi bi-exclamation-circle"></i> {{errorMessage}}
        </div>

        <!-- Submit button -->
        <button 
          type="submit" 
          class="btn btn-submit w-100"
          [disabled]="isLoading">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">
            <i class="bi bi-hourglass-split"></i> Connexion...
          </span>
        </button>
      </form>

      <!-- Register link -->
      <div class="register-link">
        Pas encore de compte ? 
        <a routerLink="/register">S'inscrire ici</a>
      </div>
    </div>
  </div>
</div>
